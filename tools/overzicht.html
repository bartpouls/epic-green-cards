<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overzicht casus-data</title>
<style>
:root {
  --bg: #ffffff; --tekst: #1d2330; --zacht: #5a6272; --lijn: #d5d9e0; --vlak: #f4f6f9;
  --accent: #1f4e79; --open: #fff4d6; --open-lijn: #d9a400; --meta: #eceff3; --meta-lijn: #8a93a3;
  --rood: #a4161a; --goed: #1b6b3a;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 56px; }
body { margin: 0; background: var(--bg); color: var(--tekst); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
header.balk { position: sticky; top: 0; z-index: 5; background: var(--accent); color: #fff; padding: 8px 20px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
header.balk strong { margin-right: 8px; }
header.balk a { color: #fff; text-decoration: none; padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,.4); font-size: 14px; }
header.balk a:hover { background: rgba(255,255,255,.2); }
main { max-width: 1180px; margin: 0 auto; padding: 8px 20px 60px; }
h1 { font-size: 24px; margin: 20px 0 4px; }
h2 { font-size: 20px; margin: 34px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--accent); color: var(--accent); }
h3 { font-size: 16px; margin: 22px 0 6px; }
h4 { font-size: 15px; margin: 14px 0 4px; }
p { margin: 6px 0; }
.zacht { color: var(--zacht); }
.klein { font-size: 13px; }
table { border-collapse: collapse; width: 100%; margin: 6px 0 10px; font-size: 13.5px; }
th, td { border: 1px solid var(--lijn); padding: 4px 8px; vertical-align: top; text-align: left; }
th { background: var(--vlak); font-weight: 600; }
td.id { font-weight: 700; white-space: nowrap; }
dl.kv { display: grid; grid-template-columns: minmax(120px, 190px) 1fr; gap: 3px 14px; margin: 6px 0; }
dl.kv dt { color: var(--zacht); }
dl.kv dd { margin: 0; }
dl.kv dl.kv { margin: 0; }
ul, ol { margin: 4px 0; padding-left: 22px; }
.kaartlijst { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.kaartlijst li { border: 1px solid var(--lijn); background: var(--vlak); border-radius: 4px; padding: 2px 8px; font-size: 13.5px; }
.kaartlijst li b { margin-right: 6px; }
.kaart-blok, .inv, .blok { border: 1px solid var(--lijn); border-radius: 6px; padding: 8px 12px; margin: 8px 0; background: #fff; }
.inv > .kop { font-weight: 700; margin-bottom: 4px; }
.inv .ernst { display: inline-block; min-width: 64px; background: var(--vlak); border: 1px solid var(--lijn); border-radius: 4px; padding: 0 6px; margin-left: 8px; font-weight: 400; font-size: 13px; }
.etiket { color: var(--zacht); font-size: 12.5px; text-transform: none; }
.casus-tekst { border-left: 3px solid var(--accent); padding-left: 10px; margin: 4px 0; }
.meta { background: var(--meta); border-left: 4px solid var(--meta-lijn); border-radius: 3px; padding: 4px 10px; margin: 6px 0; font-size: 13.5px; }
.meta > .etiket { display: block; font-weight: 600; margin-bottom: 2px; }
.open-badge { display: inline-block; background: var(--open); border: 1px solid var(--open-lijn); color: #6b4c00; border-radius: 10px; padding: 0 8px; font-size: 12px; margin-left: 6px; text-decoration: none; white-space: nowrap; font-weight: 400; }
.open-vraag { background: var(--open); border: 1px solid var(--open-lijn); border-radius: 6px; padding: 8px 12px; margin: 8px 0; }
.open-vraag .nr { font-weight: 700; }
.open-vraag p { margin: 4px 0; }
.pred { margin: 2px 0; }
.pred ul { list-style: none; margin: 2px 0 2px 4px; padding-left: 14px; border-left: 2px solid var(--lijn); }
.pred li { margin: 3px 0; }
.pred .bind { font-weight: 600; color: var(--accent); }
.pred .niet { font-weight: 700; color: var(--rood); }
.pred-blok { background: var(--vlak); border-radius: 4px; padding: 6px 10px; margin: 4px 0; }
.waarsch { color: var(--rood); font-weight: 600; }
details { margin: 6px 0; }
details > summary { cursor: pointer; color: var(--accent); }
pre.json { background: var(--vlak); padding: 6px 10px; overflow-x: auto; font-size: 12px; margin: 4px 0; }
.goed { color: var(--goed); font-weight: 600; }
.fout-melding { background: #fde8e8; border: 1px solid var(--rood); padding: 10px 14px; border-radius: 6px; margin: 20px 0; }
@media print { header.balk { display: none; } }
@media (max-width: 800px) { main { padding: 8px 12px 40px; } dl.kv { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="balk" id="balk"><strong>Overzicht casus-data</strong></header>
<main id="app"><p class="zacht">Bezig met laden…</p></main>

<script>
(function () {
  'use strict';

  // ---------- Laden (klassieke scripts, werkt via file://) ----------
  function laadScript(src, klaar) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = function () { klaar(null); };
    s.onerror = function () { klaar(new Error('Kon ' + src + ' niet laden.')); };
    document.head.appendChild(s);
  }
  function laadReeks(lijst, klaar) {
    var i = 0;
    (function stap(fout) {
      if (fout) return klaar(fout);
      if (i >= lijst.length) return klaar(null);
      laadScript(lijst[i++], stap);
    })(null);
  }
  // Het uitgeknipte bestandsdeel (uwi-e1..e3) wordt alleen geladen als uwi.js zelf nog geen episodes bevat.
  laadReeks(['../casussen/uwi.js', '../regels/predicaten.js'], function (f) {
    if (f) return toonFout(f.message);
    var c = window.CASUSSEN && window.CASUSSEN[0];
    var extra = (c && c.episodes && c.episodes.length) ? [] : ['../casussen/uwi-e1.js', '../casussen/uwi-e2.js', '../casussen/uwi-e3.js'];
    laadReeks(extra, function (f2) {
      if (f2) return toonFout(f2.message);
      c = window.CASUSSEN && window.CASUSSEN[0];
      // De casusreferentie staat in een eigen bestand, tenzij die al in de casus is samengevoegd.
      if (c && !c.referentie) laadScript('../casussen/uwi-referentie.js', function () { opbouwen(); });
      else opbouwen();
    });
  });

  function opbouwen() {
    try { start(); window.OVERZICHT_KLAAR = true; }
    catch (e) { toonFout('Er ging iets mis bij het opbouwen van het overzicht: ' + e.message); window.OVERZICHT_FOUT = String(e && e.stack || e); }
  }

  function toonFout(tekst) {
    var app = document.getElementById('app');
    app.innerHTML = '';
    var d = document.createElement('div'); d.className = 'fout-melding'; d.textContent = tekst;
    app.appendChild(d);
    window.OVERZICHT_FOUT = tekst;
  }

  // ---------- DOM-hulpjes ----------
  function voegToe(e, kids) {
    if (kids == null || kids === false) return;
    if (!Array.isArray(kids)) kids = [kids];
    kids.forEach(function (c) {
      if (c == null || c === false) return;
      if (Array.isArray(c)) return voegToe(e, c);
      e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
    });
  }
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    voegToe(e, kids);
    return e;
  }
  function isTodoSleutel(k) { return /^TODO_BART/.test(k); }
  function isLeeg(v) { return v === null || v === undefined; }

  // ---------- Toestand van het overzicht ----------
  var casus = null, ep = null, todoMap = [];

  // ---------- Opzoeken van labels (alles uit de data) ----------
  function kaartVan(id) {
    var l = casus.kaarten || [];
    for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i];
    return null;
  }
  function medicatieVan(id) {
    var l = (ep && ep.patient && ep.patient.medicatie) || [];
    for (var i = 0; i < l.length; i++) {
      var m = l[i];
      if (typeof m === 'string' ? m === id : m.id === id) return m;
    }
    return null;
  }
  function lab(id) {
    var k = kaartVan(id);
    if (k) return '‘' + k.label + '’ (' + id + ')';
    var m = medicatieVan(id);
    if (m) return '‘' + (typeof m === 'string' ? m : m.label) + '’';
    return '‘' + id + '’';
  }
  function labs(x, woord) {
    return (Array.isArray(x) ? x : [x]).map(lab).join(woord || ' of ');
  }
  function rolLab(rol) {
    var r = casus.rollen && casus.rollen[rol];
    return r ? lab(r) : 'de bijbehorende bijsturingskaart';
  }
  function gebeurtenisLab(id) { return 'gebeurtenis ' + id; }

  // ---------- Open vragen (TODO_BART) ----------
  function todoSleutels(obj) {
    var r = [];
    if (obj && typeof obj === 'object' && !Array.isArray(obj)) {
      Object.keys(obj).forEach(function (k) { if (isTodoSleutel(k) && typeof obj[k] === 'string') r.push(obj[k]); });
    }
    return r;
  }
  // Bij een open vraag op de plek zelf: kies de vraag uit de lijst die bij deze tekst hoort (bij dubbelen: die van de huidige episode).
  function todoIdVoor(stuk) {
    var l = casus.todoBart || [], gevonden = [];
    for (var i = 0; i < l.length; i++) if ((l[i].vraag || '').indexOf(stuk) >= 0) gevonden.push(l[i].id);
    if (!gevonden.length) return null;
    if (ep && gevonden.length > 1) {
      for (var k = 0; k < gevonden.length; k++) if (gevonden[k].indexOf('-' + ep.id + '-') >= 0) return gevonden[k];
    }
    return gevonden[0];
  }
  var badgeNr = {};     // id van de open vraag -> aantal markeringen op de plek zelf
  function badges(obj) {
    var uit = [];
    todoSleutels(obj).forEach(function (t) {
      t.split(' | ').forEach(function (stuk) {
        var id = todoIdVoor(stuk);
        if (id) {
          badgeNr[id] = (badgeNr[id] || 0) + 1;
          uit.push(el('a', { 'class': 'open-badge', href: '#todo-' + id, id: 'plek-' + id + '-' + badgeNr[id] }, 'open vraag ' + id));
        } else uit.push(el('span', { 'class': 'open-badge' }, 'open vraag'));
      });
    });
    return uit;
  }

  // Leesbare plek-aanduiding (de data heeft code-achtige plekken zoals "E2.invarianten[].ernst").
  var PLEKWOORD = {
    patient: 'patiëntkaart', zichtbaar: 'wat de student ziet', verborgen: 'verborgen gegevens', waar: 'ware waarden', meta: 'toelichting voor de ontwerper',
    invarianten: 'invarianten', invariant: 'invariant', vraagVarianten: 'andere vragen', weglaatDownside: 'downside bij weglaten', ernst: 'ernst',
    score: 'score', duurzaamheid: 'duurzaamheid', doelmatigheid: 'doelmatigheid', regels: 'regels', profielen: 'profielen',
    feedbackExtra: 'extra feedbackvragen', zichtbaarAlsOntbreekt: 'wat er zichtbaar wordt als een kaart ontbreekt', statusTeksten: 'statusteksten',
    gebeurtenissen: 'gebeurtenissen', knoppen: 'knoppen', werkzaamheid: 'werkzaamheid', kaarten: 'kaarten', doelen: 'doelen en opties', effect: 'effect',
    downside: 'downside', raadplegen: 'richtlijn raadplegen', bronnen: 'bronnen', repertoire: 'repertoire', casusMedicatieregel: 'medicatieregel uit de casus',
    medicatieTekst: 'medicatietekst', risicogroep: 'risicogroep', referentie: 'casusreferentie', geldigeRoutes: 'geldige routes'
  };
  function plekTxt(plek) {
    if (isLeeg(plek)) return '';
    return String(plek).split(/\s*;\s*/).map(function (deel) {
      var m = /^(E\d+)\.(.*)$/.exec(deel), voor = '', rest = deel;
      if (m) { voor = 'Episode ' + m[1].slice(1); rest = m[2]; }
      var haakje = '';
      var h = /\s*(\(.*\))\s*$/.exec(rest);
      if (h) { haakje = ' ' + h[1]; rest = rest.slice(0, h.index); }
      var delen = rest.split('.').filter(Boolean).map(function (d, idx, all) {
        var b = /^([A-Za-zÀ-ÿ_]+)\[(.*)\]$/.exec(d);
        if (b) {
          var naam = PLEKWOORD[b[1]] || b[1];
          return b[2] ? naam + ' ' + b[2].split(',').join(', ') : naam;
        }
        if (/^I\d+(,\s*I\d+)*$/.test(d) && idx > 0 && all[idx - 1] === 'invarianten') return d;
        return PLEKWOORD[d] || d;
      });
      // "invarianten, I1" -> "invariant I1"
      var uit = [];
      for (var q = 0; q < delen.length; q++) {
        if (delen[q] === 'invarianten' && q + 1 < delen.length && /^I\d/.test(delen[q + 1])) { uit.push('invariant ' + delen[q + 1]); q++; }
        else uit.push(delen[q]);
      }
      return [voor].concat(uit).filter(Boolean).join(', ') + haakje;
    }).join('; ');
  }
  window.OVERZICHT_PLEK = plekTxt;

  // ---------- Generieke weergave van waarden ----------
  // Alleen vaste, niet-klinische namen. Alle andere veldnamen worden uit de sleutel in de data afgeleid.
  var VELDNAMEN = {
    raadplegenKost: 'Richtlijn raadplegen kost (acties)',
    casusTekst: 'Zoals in de casus', afrondenPasNaGebeurtenissen: 'Afronden pas na de gebeurtenissen'
  };
  function veldnaam(k) {
    if (VELDNAMEN[k]) return VELDNAMEN[k];
    var t = String(k).replace(/([a-z]{2,})([A-Z])/g, '$1 $2').replace(/ ([A-Z])([a-z])/g, function (m, a, b) { return ' ' + a.toLowerCase() + b; });
    return t.charAt(0).toUpperCase() + t.slice(1);
  }

  function waarde(v) {
    if (isLeeg(v)) return el('span', { 'class': 'zacht' }, '(leeg)');
    if (typeof v === 'boolean') return document.createTextNode(v ? 'ja' : 'nee');
    if (typeof v === 'string' || typeof v === 'number') return document.createTextNode(String(v));
    if (Array.isArray(v)) {
      if (v.every(function (x) { return typeof x !== 'object' || x === null; })) return document.createTextNode(v.join(', '));
      return el('ul', null, v.map(function (x) { return el('li', null, waarde(x)); }));
    }
    return velden(v, []);
  }
  function velden(obj, sla) {
    var rijen = [];
    Object.keys(obj).forEach(function (k) {
      if (isTodoSleutel(k) || (sla && sla.indexOf(k) >= 0)) return;
      if (k === 'meta') { rijen.push({ meta: obj[k] }); return; }
      rijen.push({ k: k, v: obj[k] });
    });
    if (!rijen.length) return document.createTextNode('');
    var dl = el('dl', { 'class': 'kv' });
    rijen.forEach(function (r) {
      if (r.meta !== undefined) {
        dl.appendChild(el('dt', null, 'Alleen voor de ontwerper'));
        dl.appendChild(el('dd', null, metaBox(r.meta)));
      } else {
        dl.appendChild(el('dt', null, veldnaam(r.k)));
        dl.appendChild(el('dd', null, waarde(r.v)));
      }
    });
    return dl;
  }
  function rest(obj, bekend) {
    var dl = velden(obj, bekend);
    return dl.nodeType === 1 ? dl : null;
  }
  function metaBox(m, titel) {
    return el('div', { 'class': 'meta' }, [
      el('span', { 'class': 'etiket' }, titel || 'Niet zichtbaar voor de student (alleen voor de ontwerper)'),
      waarde(m)
    ]);
  }
  function casusQuote(tekst) {
    if (isLeeg(tekst)) return null;
    var lijst = Array.isArray(tekst) ? tekst : [tekst];
    return el('div', { 'class': 'casus-tekst' }, [el('span', { 'class': 'etiket' }, 'Zoals in de casus: '), lijst.join(' / ')]);
  }

  // ---------- Predicaat naar leesbare Nederlandse tekst (generiek) ----------
  var KVELDEN = ['kaart', 'doel', 'optie', 'optieNiet', 'kaartUit', 'start', 'naGebeurtenis', 'voorGebeurtenis'];
  function kOf(p, uitsluiten) {
    if (p.K && typeof p.K === 'object') return p.K;
    var k = {};
    KVELDEN.forEach(function (f) {
      if (f in p && !(uitsluiten && uitsluiten.indexOf(f) >= 0)) k[f] = p[f];
    });
    return k;
  }
  var OPERATOREN = {
    '<': 'kleiner dan', '<=': 'kleiner dan of gelijk aan', '>': 'groter dan', '>=': 'groter dan of gelijk aan',
    '==': 'gelijk aan', '=': 'gelijk aan', '!=': 'niet gelijk aan'
  };
  function opTxt(o) { return OPERATOREN[o] || String(o); }

  // NU = true: het predicaat wordt tijdens het spel op de huidige stand beoordeeld (bij 'Kan alleen gekozen worden als').
  var NU = false;

  // Beschrijving van een kaartverwijzing (K).
  function kd(k) {
    var s;
    if (k.start != null) {
      s = 'het starten van ' + labs(k.start) + ' (met die kaart zelf, of met ' + rolLab('wissel') + ' waarbij dat middel het doel is)';
    } else if (k.kaartUit != null) {
      var lijst = (ep && ep[k.kaartUit]) || [];
      s = 'een van deze kaarten: ' + lijst.map(lab).join(', ');
    } else if (k.kaart != null) {
      s = labs(k.kaart);
    } else {
      s = 'een kaart';
    }
    if ('doel' in k) s += isLeeg(k.doel) ? ', zonder doel' : ', met doel ' + lab(k.doel);
    if ('optie' in k) s += isLeeg(k.optie) ? ', zonder optie' : ', met optie ‘' + k.optie + '’';
    if (k.optieNiet && k.optieNiet.length) s += ', niet met de optie ' + k.optieNiet.map(function (o) { return '‘' + o + '’'; }).join(' of ') + ' (een regel zonder optie telt wel mee)';
    if (k.naGebeurtenis != null) s += ', op of na de dag van ' + gebeurtenisLab(k.naGebeurtenis);
    if (k.voorGebeurtenis != null) s += ', vóór de dag van ' + gebeurtenisLab(k.voorGebeurtenis);
    return s;
  }
  // Moment bij actief / medicatieActief.
  function momentTxt(op) {
    if (isLeeg(op)) return '';
    if (op.dag != null) return 'aan het einde van dag ' + op.dag;
    if (op.eindeBeurtNaGebeurtenis != null) {
      var off = op.offset || 0;
      return 'aan het einde van de beurt van ' + gebeurtenisLab(op.eindeBeurtNaGebeurtenis) + (off ? ' ' + (off > 0 ? '+' : '−') + Math.abs(off) + ' dag(en)' : '') + ' (is die gebeurtenis niet geweest, dan is dit niet waar)';
    }
    if (op.naKaart) return 'direct na de eerste keer dat ' + kd(op.naKaart) + ' is gespeeld';
    return 'op een ander, niet herkend moment';
  }
  // De klachtenstatussen: de tekst voor de student komt uit de data, de uitleg beschrijft alleen wanneer de status geldt.
  var STATUSUITLEG = {
    af: 'minstens één werkzaam middel is actief',
    aan: 'er is een middel actief, maar geen enkel werkzaam middel',
    geenVerbetering48: 'er is te lang geen werkzaam middel actief geweest'
  };
  function statusUitleg(w) { return STATUSUITLEG[w] || 'een andere status'; }
  function statusTxt(w) {
    var t = ep && ep.statusTeksten && ep.statusTeksten[w];
    return 'de klachtenstatus ' + (t ? '“' + t + '”' : '(zonder tekst voor de student)') + ' (' + statusUitleg(w) + ')';
  }
  function tellerTxt(t) {
    if (t.t === 'gespeeld') {
      return 'het aantal keer dat ' + kd(kOf(t)) + ' is gespeeld' + (t.terwijlKlachten ? ' (alleen op dagen waarop ' + statusTxt(t.terwijlKlachten) + ')' : '');
    }
    if (t.t === 'aantalActieveAntibiotica') return 'het hoogste aantal tegelijk actieve antibiotica tijdens de episode';
    return 'een telling die dit overzicht niet kent (‘' + t.t + '’)';
  }

  function tekst(s) { return el('span', null, s); }
  function lijstPred(kop, args, klasse) {
    var d = el('div', { 'class': 'pred' }, [el('span', { 'class': klasse || 'bind' }, kop)]);
    if (!args || !args.length) { d.appendChild(el('span', { 'class': 'zacht' }, ' (lege lijst)')); return d; }
    var ul = el('ul');
    args.forEach(function (a) { ul.appendChild(el('li', null, pred(a))); });
    d.appendChild(ul);
    return d;
  }
  function waardeTxt(v) { return v === true ? 'ja' : v === false ? 'nee' : String(v); }

  function pred(p) {
    if (!p || typeof p !== 'object') return tekst('(geen predicaat)');
    switch (p.p) {
      case 'gespeeld': return tekst((NU ? 'Tot nu toe gespeeld: ' : 'Gespeeld: ') + kd(kOf(p)));
      case 'nietGespeeld': return tekst((NU ? 'Tot nu toe niet gespeeld: ' : 'Niet gespeeld: ') + kd(kOf(p)));
      case 'voor': return tekst('Eerder gespeeld: ' + kd(p.a) + ', vóór ' + kd(p.b) + ' (de eerste keer van elk; is een van beide niet gespeeld, dan is dit niet waar)');
      case 'na': return tekst('Later gespeeld: ' + kd(p.a) + ', ná ' + kd(p.b) + ' (de eerste keer van elk; is een van beide niet gespeeld, dan is dit niet waar)');
      case 'binnenBeurten': {
        var gb = p.naGebeurtenis != null ? p.naGebeurtenis : (p.K && p.K.naGebeurtenis);
        return tekst('Gespeeld: ' + kd(kOf(p, ['naGebeurtenis'])) + ', binnen ' + p.n + ' beurt(en) vanaf ' + gebeurtenisLab(gb) + ' (de beurt van die gebeurtenis telt als eerste; is de gebeurtenis niet geweest, dan is dit niet waar)');
      }
      case 'binnenBeurtenNaKaart':
        return tekst('Gespeeld: ' + kd(kOf(p)) + ', binnen ' + p.n + ' beurt(en) vanaf de beurt waarin ' + kd(p.naKaart) + ' voor het eerst is gespeeld (die beurt telt als eerste)');
      case 'opDagRelatief': {
        var bereik = isLeeg(p.tot) ? 'minstens ' + p.van + ' dag(en)' : (p.van === p.tot ? 'precies ' + p.van + ' dag(en)' : 'tussen ' + p.van + ' en ' + p.tot + ' dagen');
        return tekst('Gespeeld: ' + kd(kOf(p)) + ', ' + bereik + ' na de dag waarop ' + kd(p.anker) + ' voor het eerst is gespeeld (dezelfde dag = 0 dagen erna)');
      }
      case 'gestart': return tekst('Gestart: ' + labs(p.middel) + ' (met die kaart zelf, of met ' + rolLab('wissel') + ' waarbij dat middel het doel is)');
      case 'actief': {
        var wie = p.middel != null ? labs(p.middel) : 'minstens één van de antibiotica van deze episode (' + (ep && ep.antibiotica ? ep.antibiotica.map(lab).join(', ') : '') + ')';
        var s = 'Actief (gestart en niet gestopt of vervangen): ' + wie;
        if (p.uitSet) s += ', en dat middel is ‘' + p.uitSet + '’ volgens de gebeurtenissen die zijn geweest';
        s += p.op ? ', ' + momentTxt(p.op) : (NU ? ', op dit moment' : ', aan het einde van de episode');
        return tekst(s);
      }
      case 'aantalActieveAntibiotica':
        return tekst('Het hoogste aantal tegelijk actieve antibiotica (na elke gespeelde kaart gemeten' + (NU ? ', tot nu toe' : '') + ') is ' + opTxt(p.op) + ' ' + p.n);
      case 'medicatieActief':
        return tekst('Medicatie ' + lab(p.id) + ' is actief (niet gepauzeerd, of na de pauze weer hervat)' + (p.op ? ', ' + momentTxt(p.op) : (NU ? ', op dit moment' : ', aan het einde van de episode')));
      case 'waar':
        return tekst('De ware waarde van ‘' + p.veld + '’ (ook als de student die niet ziet) is ' + opTxt(p.op) + ' ' + waardeTxt(p.waarde));
      case 'inToestand': return tekst('De patiënt is in de toestand ‘' + p.t + '’');
      case 'gebeurtenisGeweest': return tekst('Gebeurtenis ' + p.id + ' heeft plaatsgevonden');
      case 'klachten': {
        var wanneer = NU ? 'tot nu toe' : 'ooit tijdens de episode';
        if (p.op === 'laatste') wanneer = 'op de laatste dag';

        else if (p.op && p.op.eindeBeurtNaGebeurtenis != null) wanneer = 'op de dag van ' + gebeurtenisLab(p.op.eindeBeurtNaGebeurtenis) + (p.op.offset ? ' ' + (p.op.offset > 0 ? '+' : '−') + Math.abs(p.op.offset) + ' dag(en)' : '');
        return tekst('Er geldt ' + statusTxt(p.waarde) + ', ' + wanneer);
      }
      case 'en': return lijstPred('Alle onderstaande zijn waar:', p.args);
      case 'of': return lijstPred('Minstens één van onderstaande is waar:', p.args);
      case 'niet': {
        var d = el('div', { 'class': 'pred' }, [el('span', { 'class': 'niet' }, 'NIET: ')]);
        d.appendChild(pred(p.arg));
        return d;
      }
      case 'alsDan': {

        var u = el('ul');
        u.appendChild(el('li', null, pred(p.als)));

      default:
        return el('span', { 'class': 'waarsch' }, 'Onbekend predicaat ‘' + p.p + '’: dit overzicht kan de regel niet in gewoon Nederlands tonen.');
    }

    var wrap = el('section', { id: 'open' });

    var groepen = [{ sleutel: '', titel: 'Kaartenbibliotheek en algemeen', items: [] }];
    (c.episodes || []).forEach(function (e) { groepen.push({ sleutel: e.id, titel: 'Episode ' + e.id + ' (level ' + e.level + ')', items: [] }); });
    lijst.forEach(function (t) {
      var m = /^TODO_BART-(E\d+)-/.exec(t.id || '') || /^(E\d+)[.\[]/.exec(t.plek || '');
      var g = groepen[0];
      if (m) for (var i = 1; i < groepen.length; i++) if (groepen[i].sleutel === m[1]) g = groepen[i];
      g.items.push(t);
    });
    function nr(t) { var m = /(\d+)\s*$/.exec(t.id || ''); return m ? +m[1] : 0; }
    groepen.forEach(function (g) {
      if (!g.items.length) return;
      g.items.sort(function (a, b) { return nr(a) - nr(b); });
      wrap.appendChild(el('h3', null, g.titel + ' (' + g.items.length + ')'));
      g.items.forEach(function (t) {
        wrap.appendChild(el('div', { 'class': 'open-vraag', id: 'todo-' + t.id, 'data-todo-id': t.id }, [

        ]));
      });
    });

    // Open vragen die alleen op de plek zelf in de data staan en niet in de lijst.
    var extra = [];
    (function loop(o, pad) {
      if (Array.isArray(o)) return o.forEach(function (x, i) { loop(x, pad + '[' + i + ']'); });
      if (!o || typeof o !== 'object') return;
      Object.keys(o).forEach(function (k) {
        if (isTodoSleutel(k) && typeof o[k] === 'string') {
          o[k].split(' | ').forEach(function (stuk) { if (!todoIdVoor(stuk)) extra.push({ pad: pad + '.' + k, tekst: stuk }); });
        } else loop(o[k], pad + '.' + k);
      });
    })(c, 'casus');
    if (extra.length) {
      wrap.appendChild(el('h3', null, 'Alleen op de plek zelf vastgelegd, niet in de lijst hierboven (' + extra.length + ')'));

          el('p', { 'class': 'zacht' }, 'plek: ' + x.pad), el('p', null, x.tekst)
        ]));
      });
    }
    return wrap;
  }

      if (!isLeeg(i.weglaatDownside)) {
        dl.appendChild(el('dt', null, 'Downside bij weglaten'));
        dl.appendChild(el('dd', null, typeof i.weglaatDownside === 'string' && kaartVan(i.weglaatDownside) ? lab(i.weglaatDownside) : waarde(i.weglaatDownside)));
      }
      blok.appendChild(dl);
      blok.appendChild(predBlok(i.predicaat, 'Schending als'));
      if (i.meta) blok.appendChild(metaBox(i.meta));
      var r = rest(i, ['id', 'ernst', 'geldtIn', 'geldtInTekst', 'altijdFout', 'predicaat', 'vraag', 'vraagVarianten', 'bron', 'weglaatDownside', 'meta']);
      if (r) blok.appendChild(r);
      w.appendChild(blok);
    });
    return w;
  }

  function scoreAs(naam, as) {
    var w = el('div', { 'class': 'blok', 'data-score': naam });
    w.appendChild(el('div', null, [el('b', null, naam.charAt(0).toUpperCase() + naam.slice(1)), badges(as)]));
    if (as.casusTekst) w.appendChild(casusQuote(as.casusTekst));
    if (!isLeeg(as.start)) w.appendChild(el('p', null, 'Begint op ' + as.start + '.'));
    var regels = as.regels || [];
    if (regels.length) {
      var ol = el('ol');
      regels.forEach(function (r) {
        var li = el('li');
        var uitkomst;
        if (!isLeeg(r.punten)) uitkomst = 'score ' + r.punten;
        else if (!isLeeg(r.delta)) uitkomst = (r.delta > 0 ? '+' : '−') + Math.abs(r.delta) + ' punt';
        else uitkomst = '(geen uitkomst)';
        if (r.perKeer) {
          li.appendChild(el('div', null, ['Per keer: ', tellerTxt(r.perKeer), ' → ', el('b', null, uitkomst), badges(r)]));
        } else {
          li.appendChild(el('div', null, ['Als: ', el('b', null, '→ ' + uitkomst), badges(r)]));
          li.appendChild(predBlok(r.als));
        }
        if (r.meta) li.appendChild(metaBox(r.meta));
        var ov = rest(r, ['als', 'perKeer', 'punten', 'delta', 'meta']);
        if (ov) li.appendChild(ov);
        ol.appendChild(li);
      });
      w.appendChild(ol);
    }
    var ov2 = rest(as, ['casusTekst', 'start', 'regels']);
    if (ov2) w.appendChild(ov2);
    return w;
  }

  function scoreBlok(e) {
    var w = el('div');
    w.appendChild(el('h3', null, 'Score-regels'));
    var s = e.score || {};
    badges(s).forEach(function (b) { w.appendChild(b); });
    Object.keys(s).forEach(function (k) {
      if (isTodoSleutel(k)) return;
      if (s[k] && typeof s[k] === 'object' && !Array.isArray(s[k])) w.appendChild(scoreAs(k, s[k]));
    });
    return w;
  }

  function profielenBlok(e) {
    var w = el('div');
    var pr = e.profielen || [];
    w.appendChild(el('h3', null, 'Profielen met reflectievraag'));
    w.appendChild(el('p', { 'class': 'zacht klein' }, 'Het eerste profiel (op volgorde) waarvan de voorwaarde klopt, wint.'));
    pr.forEach(function (p, i) {
      var blok = el('div', { 'class': 'blok', 'data-profiel': e.id + ':' + i });
      blok.appendChild(el('div', null, [el('b', null, (i + 1) + '. ' + p.naam), badges(p)]));
      if (p.casusTekst) blok.appendChild(casusQuote(p.casusTekst));
      blok.appendChild(predBlok(p.als, 'Profiel als'));
      blok.appendChild(el('div', null, [el('span', { 'class': 'etiket' }, 'Reflectievraag: '), isLeeg(p.reflectievraag) ? el('span', { 'class': 'zacht' }, '(geen reflectievraag in de casus)') : p.reflectievraag]));
      if (p.meta) blok.appendChild(metaBox(p.meta));
      var ov = rest(p, ['naam', 'als', 'reflectievraag', 'casusTekst', 'meta']);
      if (ov) blok.appendChild(ov);
      w.appendChild(blok);
    });
    return w;
  }

  var WANNEER = {
    altijd: 'altijd (ook bij een poortschending, naast de ene vraag van de ernstigste schending)',
    alleenBijGehaaldePoort: 'alleen als de poort gehaald is'
  };
  function feedbackBlok(e) {
    var w = el('div');
    var f = e.feedbackExtra || [];
    w.appendChild(el('h3', null, 'Extra feedbackvragen (feedbackExtra)'));
    f.forEach(function (x, i) {
      var blok = el('div', { 'class': 'blok', 'data-feedback': e.id + ':' + i });
      blok.appendChild(el('div', null, [el('b', null, 'Vraag: '), isLeeg(x.vraag) ? '' : x.vraag, badges(x)]));
      blok.appendChild(el('div', null, [el('span', { 'class': 'etiket' }, 'Verschijnt: '), WANNEER[x.wanneer] || String(x.wanneer)]));
      blok.appendChild(predBlok(x.trigger, 'Wanneer geldt dit'));
      if (x.meta) blok.appendChild(metaBox(x.meta));
      var ov = rest(x, ['trigger', 'vraag', 'wanneer', 'meta']);
      if (ov) blok.appendChild(ov);
      w.appendChild(blok);
    });
    if (!f.length) w.appendChild(el('p', { 'class': 'zacht' }, 'Geen.'));
    return w;
  }

  function zichtbaarBlok(e) {
    var w = el('div');
    var z = e.zichtbaarAlsOntbreekt || [];
    w.appendChild(el('h3', null, 'Wat er zichtbaar wordt als een kaart ontbreekt (zichtbaarAlsOntbreekt)'));
    z.forEach(function (x, i) {
      var blok = el('div', { 'class': 'blok', 'data-zichtbaar': e.id + ':' + i });
      blok.appendChild(el('div', null, [el('b', null, 'Tekst: '), isLeeg(x.tekst) ? '' : x.tekst, badges(x)]));
      blok.appendChild(predBlok(x.trigger, 'Wanneer geldt dit'));
      if (x.meta) blok.appendChild(metaBox(x.meta));
      var ov = rest(x, ['trigger', 'tekst', 'meta']);
      if (ov) blok.appendChild(ov);
      w.appendChild(blok);
    });
    if (!z.length) w.appendChild(el('p', { 'class': 'zacht' }, 'Geen.'));
    return w;
  }

  function werkzaamheidBlok(e) {
    var w = el('div');
    w.appendChild(el('h3', null, 'Werkzaamheid (bepaalt de klachtenstatus per dag)'));
    var wz = e.werkzaamheid || {};
    Object.keys(wz).forEach(function (toestand) {
      if (isTodoSleutel(toestand)) return;
      var t = wz[toestand];
      var blok = el('div', { 'class': 'blok', 'data-werkzaamheid': e.id + ':' + toestand });
      blok.appendChild(el('div', null, [el('b', null, 'Toestand ‘' + toestand + '’'), badges(t)]));
      ['werkzaam', 'nietWerkzaam'].forEach(function (soort) {
        var l = t[soort] || [];
        blok.appendChild(el('h4', null, soort === 'werkzaam' ? 'Werkzaam (de klachten nemen af)' : 'Niet werkzaam (de klachten houden aan)'));
        if (!l.length) { blok.appendChild(el('p', { 'class': 'zacht' }, 'Geen.')); return; }
        blok.appendChild(el('ul', null, l.map(function (x) {
          var li = el('li', null, [lab(x.kaart), badges(x)]);
          if (x.als) li.appendChild(predBlok(x.als, 'Alleen als'));
          if (x.meta) li.appendChild(metaBox(x.meta));
          var ov = rest(x, ['kaart', 'als', 'meta']);
          if (ov) li.appendChild(ov);
          return li;
        })));
      });
      var ov2 = rest(t, ['werkzaam', 'nietWerkzaam']);
      if (ov2) blok.appendChild(ov2);
      w.appendChild(blok);
    });
    badges(wz).forEach(function (b) { w.appendChild(b); });
    return w;
  }

  function statusBlok(e) {
    var w = el('div');
    w.appendChild(el('h3', null, 'Statusteksten (klachten per dag)'));
    var st = e.statusTeksten || {};
    var dl = el('dl', { 'class': 'kv', 'data-blok': 'statusTeksten' });
    var namen = { af: 'af (klachten nemen af)', aan: 'aan (klachten houden aan)', geenVerbetering48: 'geen verbetering na 48 uur' };
    Object.keys(st).forEach(function (k) {
      if (isTodoSleutel(k)) return;
      dl.appendChild(el('dt', null, namen[k] || k));
      dl.appendChild(el('dd', null, isLeeg(st[k]) ? el('span', { 'class': 'zacht' }, '(geen tekst)') : st[k]));
    });
    w.appendChild(dl);
    badges(st).forEach(function (b) { w.appendChild(b); });
    return w;
  }

  function doelenBlok(e) {
    var w = el('div');
    w.appendChild(el('h3', null, 'Doelen en V6-opties per kaart'));
    var gevonden = false;
    (e.repertoire || []).forEach(function (id) {
      var k = kaartVan(id);
      if (!k || !k.doelkaart) return;
      gevonden = true;
      var blok = el('div', { 'class': 'blok', 'data-doelkaart': e.id + ':' + id });
      blok.appendChild(el('div', null, [el('b', null, lab(id)), badges(k)]));
      var d = k.doelen && k.doelen[e.id];
      if (!d || !d.length) { blok.appendChild(el('p', { 'class': 'zacht' }, 'Geen doelen vastgelegd voor deze episode.')); w.appendChild(blok); return; }
      var ul = el('ul');
      d.forEach(function (x) {
        var li = el('li', null, [el('b', null, x.label), el('span', { 'class': 'zacht' }, ' (' + x.id + ')')]);
        if (x.vereist) li.appendChild(predBlok(x.vereist, 'Kan alleen gekozen worden als'));
        var opts = k.opties && k.opties[x.id];
        if (opts) {
          li.appendChild(el('div', { 'class': 'etiket' }, 'Opties bij dit doel (“goed” is alleen ter informatie; de poort gebruikt de invarianten):'));
          li.appendChild(el('ul', null, opts.map(function (o) {
            return el('li', { 'data-optie': e.id + ':' + id + ':' + x.id }, [o.tekst, o.goed ? el('span', { 'class': 'goed' }, '  — goed volgens de casus') : null]);
          })));
        }
        ul.appendChild(li);
      });
      blok.appendChild(ul);
      w.appendChild(blok);
    });
    if (!gevonden) w.appendChild(el('p', { 'class': 'zacht' }, 'Geen doelkaarten in dit repertoire.'));
    return w;
  }

  function episode(e) {
    ep = e;
    var s = el('section', { id: e.id, 'data-episode': e.id });
    s.appendChild(el('h2', null, 'Episode ' + e.id + ' (level ' + e.level + ')' + (e.titel ? ' — ' + e.titel : '')));
    var dl = el('dl', { 'class': 'kv' });
    if (e.startToestanden) { dl.appendChild(el('dt', null, 'Begint in toestand')); dl.appendChild(el('dd', null, e.startToestanden.join(', '))); }
    if (e.antibiotica) { dl.appendChild(el('dt', null, 'Antibiotica in deze episode')); dl.appendChild(el('dd', null, e.antibiotica.map(lab).join(', '))); }
    s.appendChild(dl);
    if (e.meta) s.appendChild(metaBox(e.meta));
    s.appendChild(patientKaart(e));
    s.appendChild(repertoireBlok(e));
    s.appendChild(knoppenBlok(e));
    s.appendChild(gebeurtenissenBlok(e));
    s.appendChild(invariantenBlok(e));
    s.appendChild(scoreBlok(e));
    s.appendChild(profielenBlok(e));
    s.appendChild(feedbackBlok(e));
    s.appendChild(zichtbaarBlok(e));
    s.appendChild(werkzaamheidBlok(e));
    s.appendChild(statusBlok(e));
    s.appendChild(doelenBlok(e));
    var ov = rest(e, ['id', 'level', 'titel', 'startToestanden', 'knoppen', 'antibiotica', 'patient', 'repertoire', 'gebeurtenissen', 'werkzaamheid', 'statusTeksten', 'invarianten', 'score', 'profielen', 'feedbackExtra', 'zichtbaarAlsOntbreekt', 'meta']);
    if (ov) { s.appendChild(el('h3', null, 'Overige velden')); s.appendChild(ov); }
    ep = null;
    return s;
  }

  // ---------- Start ----------
  function start() {
    var app = document.getElementById('app');
    var balk = document.getElementById('balk');
    app.innerHTML = '';
    var alle = window.CASUSSEN || [];
    if (!alle.length) throw new Error('Geen casus gevonden in window.CASUSSEN.');
    alle.forEach(function (c) {
      casus = c;
      document.title = 'Overzicht: ' + (c.titel || c.id);
      app.appendChild(kop(c));
      balk.appendChild(el('a', { href: '#open' }, 'Open vragen (' + (c.todoBart || []).length + ')'));
      balk.appendChild(el('a', { href: '#kaarten' }, 'Kaarten'));
      (c.episodes || []).forEach(function (e) { balk.appendChild(el('a', { href: '#' + e.id }, 'Episode ' + e.id)); });
      app.appendChild(openVragen(c));
      app.appendChild(bibliotheek(c));
      (c.episodes || []).forEach(function (e) { app.appendChild(episode(e)); });
    });
  }
})();
</script>
</body>
</html>
